<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition R workspace</title><link rel="stylesheet" href="nutritionGlass.css?v=vibrant3"><style>body{margin:0;padding:14px;height:100dvh;overflow:hidden}.apple-header{height:58px;min-height:58px!important;margin-bottom:12px!important}.apple-header-title h1{margin:0;max-width:none}.ide-menu{display:flex;gap:12px}.ide-menu details{position:relative}.ide-menu summary{cursor:pointer;list-style:none}.menu-list{position:absolute;top:28px;left:0;min-width:160px;background:var(--color-canvas);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:30}.menu-list button{display:block;width:100%;text-align:left;padding:8px}.ide-grid{display:grid;grid-template-columns:minmax(260px,1.25fr) 8px minmax(230px,1fr);grid-template-rows:minmax(200px,1.2fr) 8px minmax(180px,1fr);height:calc(100dvh - 100px);gap:6px}.apple-card{margin:0!important;padding:0!important;min-height:0;display:flex;flex-direction:column}.pane-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}.pane-body{padding:14px;overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}.source{grid-column:1;grid-row:1}.console{grid-column:1;grid-row:3}.environment{grid-column:3;grid-row:1}.output{grid-column:3;grid-row:3}.split-x{grid-column:2;grid-row:1/4;cursor:col-resize;touch-action:none}.split-y{grid-column:1/4;grid-row:2;cursor:row-resize;touch-action:none}.pane-bar button,button{background:var(--control);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:6px 10px;font:inherit;cursor:pointer}.pane-bar button[aria-selected=true]{border-color:var(--ink)}button:disabled{opacity:.4}textarea{width:100%;height:100%;box-sizing:border-box;resize:none;background:transparent;color:var(--ink);border:0;padding:14px;font:14px/1.6 ui-monospace,monospace;outline:none}.source .pane-body{padding:0;display:flex;flex-direction:column}#rw-find{padding:8px;flex-shrink:0}#rw-find input{min-width:0;width:110px}#rw-code{flex:1;min-height:0}.editor-position{font-size:12px;opacity:.8;padding:5px 14px;border-top:1px solid var(--line)}pre{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}#rw-output{height:auto}#rw-plots canvas{max-width:100%;height:auto}.toolbar{display:flex;gap:6px;flex-wrap:wrap}h1{font-size:17px}input{background:var(--control);color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:8px}#rw-command{width:100%;box-sizing:border-box;margin-top:12px}[hidden]{display:none!important}@media(max-width:700px){body{height:auto;overflow:auto}.ide-grid{display:flex;flex-direction:column;height:auto}.apple-card{height:380px}.split-x,.split-y{display:none}.ide-menu{gap:8px}.apple-header{height:auto;min-height:58px}.apple-header-badge a{display:none}}</style></head><body>
<header class="apple-header"><div class="apple-header-title"><h1>R workspace</h1></div><nav class="ide-menu"><details><summary>File</summary><div class="menu-list"><button id="rw-new">New script</button><label>Open script<input id="rw-upload" type="file" accept=".R,.r"></label><button id="rw-script">Save script</button><button id="rw-results">Export results</button></div></details><details><summary>Code</summary><div class="menu-list"><button id="rw-find-toggle">Find and replace</button><button id="rw-selection">Run selection</button><button id="rw-run">Run script</button><button id="rw-stop" disabled>Stop / reset</button></div></details><details><summary>Session</summary><div class="menu-list"><button id="rw-refresh">Refresh panes</button><button id="rw-console">Save console</button><button id="rw-save-session">Save workspace</button><label>Load workspace<input id="rw-load-session" type="file" accept=".RData,.rda"></label></div></details></nav><div class="apple-header-badge"><a href="../">Nutrition RA</a></div></header>
<main class="ide-grid"><section class="apple-card source"><div class="pane-bar">Source <span style="margin-left:auto" class="toolbar"><button id="rw-run-visible">Run</button><button id="rw-edit">Edit code</button></span></div><div class="pane-body"><div id="rw-find" class="toolbar" hidden><input id="rw-find-text" aria-label="Find in script" placeholder="Find"><input id="rw-replace-text" aria-label="Replace in script" placeholder="Replace"><button id="rw-find-next">Next</button><button id="rw-replace-one">Replace</button><button id="rw-replace-all">Replace all</button><button id="rw-find-close" aria-label="Close find">×</button><span id="rw-find-status" aria-live="polite"></span></div><textarea id="rw-code" aria-label="R script editor" spellcheck="false">results &lt;- data.frame(x=1:10, y=(1:10)^2)
print(results)
plot(results$x,results$y,type='b')</textarea><pre id="rw-menu-data" hidden></pre></div></section><div class="split-x" role="separator" aria-label="Resize columns"></div><div class="split-y" role="separator" aria-label="Resize rows"></div>
<section class="apple-card console"><div class="pane-bar">Console</div><div class="pane-body"><pre id="rw-output">Ready to run.</pre><input id="rw-command" aria-label="R console command" placeholder="R command · Enter to run"></div></section>
<section class="apple-card environment"><div class="pane-bar"><button data-upper="environment" aria-selected="true">Environment</button><button data-upper="history">History</button></div><div class="pane-body"><div id="ide-environment">Run a script to inspect its objects.</div><pre id="ide-history" hidden></pre></div></section>
<section class="apple-card output"><div class="pane-bar"><button data-lower="plots" aria-selected="true">Plots</button><button data-lower="files">Files</button><button data-lower="packages">Packages</button><button data-lower="help">Help</button></div><div class="pane-body"><div id="rw-plots"></div><div id="ide-files" hidden></div><div id="ide-packages" hidden><input id="ide-package-name" aria-label="Package name" placeholder="Package name"><button id="ide-package-install">Install</button><pre id="ide-package-list"></pre></div><div id="ide-help" hidden><input id="ide-help-topic" aria-label="Help topic" placeholder="Function name"><button id="ide-help-open">Find help</button><pre id="ide-help-text"></pre></div></div></section></main>
<script type="module" src="workspace.js?v=editor10"></script><script type="module" src="nutritionGlass.js?v=vibrant3"></script></body></html>
